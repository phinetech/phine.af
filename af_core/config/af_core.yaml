af_core:
  # Logging configuration
  logging:
    level: "info"
    console_output: true
    file_output: true
    file_path: "/app/logs/af_core.log"

  # Communication configuration
  communication:
    kind: "http"
    listen:
      host: "0.0.0.0"
      port: 8080
    timeout_ms: 5000

  qod:
    max_session_duration: 86400
    min_session_duration: 60
    session_cleanup_interval: 60
    unavailable_session_ttl: 360
    enable_notifications: true
    api_base_url: "https://api.example.com/quality-on-demand/v1"

pcf_handler:
  pcf:
    base_url: "http://pcf:80/npcf-policyauthorization/v1"
    use_tls: false
    api_version: "v1"

  communication:
    kind: "http"
    # af_core is the client of the PCF handler. `remote` is the handler's
    # address (where af_core connects); `listen` is unused by af_core for this
    # link (af_core does not bind a PCF server). In microservice mode the
    # handler is reachable by its compose service name `pcf_handler`.
    listen:
      host: "0.0.0.0"
      port: 8085
    remote:
      host: "pcf_handler"
      port: 8085
    client_only: false
    timeout_ms: 5000
