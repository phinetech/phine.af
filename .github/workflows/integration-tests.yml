name: Integration Tests

on:
  workflow_dispatch:  # Allow manual trigger only (automatic pull_request/push triggers disabled)

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  integration-tests:
    name: Run AF Core Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub (optional, for avoiding rate limits)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Create results directory
        run: |
          mkdir -p docker-compose/results
          chmod 777 docker-compose/results
          mkdir -p docker-compose/logs

      - name: Install dependencies
        run: |
          chmod +x build/scripts/ci_helper.sh
          ./build/scripts/ci_helper.sh install_dependencies

      - name: Install gtp5g kernel module
        run: ./build/scripts/ci_helper.sh install_gtp5g

      - name: Pull base images
        run: |
          cd docker-compose
          docker compose -f docker-compose-test.yaml pull db free5gc-nrf free5gc-amf free5gc-upf oai-ext-dn

      - name: Build AF components
        run: |
          cd docker-compose
          docker compose -f docker-compose-test.yaml build \
            af_core \
            pcf_handler \
            api_component \
            af-integration-tests

      - name: Start infrastructure services
        run: |
          cd docker-compose
          docker compose -f docker-compose-test.yaml up -d \
            db \
            free5gc-nrf \
            free5gc-amf \
            free5gc-ausf \
            free5gc-nssf \
            free5gc-pcf \
            free5gc-smf \
            free5gc-udm \
            free5gc-udr \
            free5gc-upf \
            free5gc-webui \
            oai-ext-dn

      - name: Wait for infrastructure to be ready
        run: ./build/scripts/ci_helper.sh wait_for_nrf

      - name: Start UE and gNB
        run: |
          cd docker-compose
          docker compose -f docker-compose-test.yaml up -d gnb ue
          echo "Waiting for UE to establish connection..."
          sleep 20

      - name: Start AF components
        run: |
          cd docker-compose
          docker compose -f docker-compose-test.yaml up -d \
            af_core \
            pcf_handler \
            api_component

      - name: Wait for AF Core to be ready
        run: ./build/scripts/ci_helper.sh wait_for_af

      - name: Show running containers
        run: docker ps -a

      - name: Run integration tests
        run: |
          cd docker-compose
          docker compose -f docker-compose-test.yaml up --exit-code-from af-integration-tests af-integration-tests
        continue-on-error: true
        id: run_tests

      - name: Collect container logs
        if: always()
        run: ./build/scripts/ci_helper.sh collect_logs docker-compose/logs

      - name: Parse test results
        if: always()
        run: ./build/scripts/ci_helper.sh parse_results docker-compose/results/test_results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            docker-compose/results/
            docker-compose/logs/
          retention-days: 30

      - name: Check test exit code
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
            echo "::error::Integration tests failed!"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          ./build/scripts/ci_helper.sh cleanup_services