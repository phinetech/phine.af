name: Build and Test

on:
  workflow_call:
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  build-components:
    name: Build (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: af-core
            dockerfile: af_core/Dockerfile
          - name: pcf-handler
            dockerfile: southbound/pcf_handler/Dockerfile
          - name: demo-qod-adapter
            dockerfile: adapters/demo-qod-adapter/Dockerfile
          - name: bundled-af
            dockerfile: Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          target: runtime
          push: false
          load: true
          tags: ${{ matrix.component.name }}:build
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }},mode=max

      - name: Verify build artifacts
        run: |
          echo "Checking image size..."
          docker images ${{ matrix.component.name }}:build

          echo "Checking for binary..."
          docker run --rm ${{ matrix.component.name }}:build sh -c "ls -lh /usr/local/bin/ || ls -lh /app/"

      - name: Export build logs
        if: failure()
        run: |
          mkdir -p build-logs
          docker build -f ${{ matrix.component.dockerfile }} -t ${{ matrix.component.name }}:build . 2>&1 | tee build-logs/${{ matrix.component.name }}.log || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.component.name }}
          path: build-logs/
          retention-days: 7

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-components

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [build-components, security-scan]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-components.result }}" != "success" ]; then
            echo "::error::Component builds failed"
            exit 1
          fi

          echo "✅ All builds passed successfully!"
