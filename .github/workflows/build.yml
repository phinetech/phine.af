name: Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feat-*'
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          if git diff --check HEAD^ HEAD; then
            echo "No trailing whitespace found"
          else
            echo "::error::Trailing whitespace found"
            exit 1
          fi
        continue-on-error: true

      - name: Check file permissions
        run: |
          find . -type f -name "*.sh" -not -executable | while read file; do
            echo "::warning file=$file::Shell script is not executable"
          done

  build-components:
    name: Build All Components
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: af-core
            path: af_core
            dockerfile: af_core/Dockerfile
          - name: pcf-handler
            path: southbound/pcf_handler
            dockerfile: southbound/pcf_handler/Dockerfile
          # - name: api-component
          #   path: northbound/api_component
          #   dockerfile: northbound/api_component/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache-${{ matrix.component.name }}
          key: ${{ runner.os }}-buildx-${{ matrix.component.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.component.name }}-

      - name: Build ${{ matrix.component.name }}
        run: |
          docker build -f ${{ matrix.component.dockerfile }} -t ${{ matrix.component.name }}:test .

      - name: Verify build artifacts
        run: |
          echo "Checking image size..."
          docker images ${{ matrix.component.name }}:test

          echo "Checking for binary..."
          docker run --rm ${{ matrix.component.name }}:test sh -c "ls -lh /usr/local/bin/ || ls -lh /app/"

      - name: Export build logs
        if: failure()
        run: |
          mkdir -p build-logs
          docker build -f ${{ matrix.component.dockerfile }} -t ${{ matrix.component.name }}:test . 2>&1 | tee build-logs/${{ matrix.component.name }}.log || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.component.name }}
          path: build-logs/
          retention-days: 7

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-components

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint-and-format, build-components, security-scan]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-components.result }}" != "success" ]; then
            echo "::error::Component builds failed"
            exit 1
          fi

          echo "✅ All builds passed successfully!"
