name: Coverage

on:
  workflow_call:

env:
  DOCKER_BUILDKIT: 1

jobs:
  coverage:
    name: Coverage (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        component:
          # Same scope as unit-tests.yml — northbound has no unit suite,
          # and af_core's tests/integration suite needs a full 5G network
          # and isn't instrumented here.
          - name: af-core
            dockerfile: af_core/Dockerfile
            diff-path: af_core
            report-path: /app/build-output/coverage.html
          - name: pcf-handler
            dockerfile: southbound/pcf_handler/Dockerfile
            diff-path: southbound/pcf_handler
            report-path: /app/southbound/pcf_handler/build-output/coverage.html
          - name: demo-qod-adapter
            dockerfile: adapters/demo-qod-adapter/Dockerfile
            diff-path: adapters/demo-qod-adapter
            report-path: /app/adapters/demo-qod-adapter/build/coverage.html

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check for relevant changes
        id: diff
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            # push event (e.g. merge to main) — github.base_ref is empty here,
            # so diff against the commit that was HEAD before this push.
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="4b825dc642cb6eb9a060e54bf8d69288fbee4904" # git empty-tree hash
            fi
          fi
          if git diff --quiet "$base...HEAD" -- "${{ matrix.component.diff-path }}"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.diff.outputs.has_changes == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build coverage report
        if: steps.diff.outputs.has_changes == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          target: coverage
          push: false
          load: true
          tags: ${{ matrix.component.name }}:coverage
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }},mode=max

      - name: Extract coverage report
        if: always() && steps.diff.outputs.has_changes == 'true'
        run: |
          docker create --name extract-coverage ${{ matrix.component.name }}:coverage
          docker cp extract-coverage:${{ matrix.component.report-path }} ./coverage.html
          docker rm extract-coverage

      - name: Upload coverage report
        if: always() && steps.diff.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.component.name }}
          path: coverage.html
          retention-days: 30

      - name: No changes to analyze
        if: steps.diff.outputs.has_changes == 'false'
        run: echo "No changes under ${{ matrix.component.diff-path }} — skipping."
