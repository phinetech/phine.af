name: Static Analysis (clang-tidy)

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feat-*'
    paths:
      - 'af_core/**'
      - 'southbound/pcf_handler/**'
      - 'adapters/demo-qod-adapter/**'
      - 'src/**'
      - 'common/**'
      - '.clang-tidy'
      - '.github/scripts/check_tidy.sh'
      - '.github/workflows/static-analysis.yml'
      - 'CMakeLists.txt'
      - 'Dockerfile'

env:
  DOCKER_BUILDKIT: 1

jobs:
  tidy:
    name: clang-tidy (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        component:
          # northbound/api_component is intentionally excluded — its build
          # is not wired into CI yet (see build.yml).
          - name: af-core
            dockerfile: af_core/Dockerfile
            diff-path: af_core
          - name: pcf-handler
            dockerfile: southbound/pcf_handler/Dockerfile
            diff-path: southbound/pcf_handler
          - name: demo-qod-adapter
            dockerfile: adapters/demo-qod-adapter/Dockerfile
            diff-path: adapters/demo-qod-adapter
          - name: bundled-af
            dockerfile: Dockerfile
            diff-path: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute changed lines
        id: diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --no-prefix -U0 "origin/${{ github.base_ref }}...HEAD" -- "${{ matrix.component.diff-path }}" > component.diff
          if [[ -s component.diff ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.diff.outputs.has_changes == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build static-analysis image
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          docker build --target static-analysis \
            -f ${{ matrix.component.dockerfile }} \
            -t ${{ matrix.component.name }}:tidy .

      - name: Run clang-tidy on changed lines
        if: steps.diff.outputs.has_changes == 'true'
        run: docker run --rm -i ${{ matrix.component.name }}:tidy < component.diff

      - name: No changes to analyze
        if: steps.diff.outputs.has_changes == 'false'
        run: echo "No changes under ${{ matrix.component.diff-path }} — skipping."
