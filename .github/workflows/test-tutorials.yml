name: Tutorials Validation

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feat-*'
    paths:
      - 'docs/getting-started/qos-enforcement-tutorial.md'
      - 'docs/getting-started/adapter-qod-tutorial.md'
      - 'af_core/**'
      - 'northbound/**'
      - 'southbound/**'
      - 'common/**'
      - 'docker-compose/**'
      - '.github/workflows/test-tutorials.yml'
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  tutorials:
    name: Run ${{ matrix.tutorial.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tutorial:
          - name: QoS Enforcement Tutorial
            file: docs/getting-started/qos-enforcement-tutorial.md
            artifact-name: qos-tutorial-logs
            log-path: /tmp/phine.af/qos-enforcement-tutorial/logs
          - name: Demo Adapter Tutorial
            file: docs/getting-started/adapter-qod-tutorial.md
            artifact-name: demo-adapter-tutorial-logs
            log-path: /tmp/phine.af/adapter-qod-tutorial/logs

    steps:
      - name: Checkout code
        if: ${{ !hashFiles('.git/HEAD') }}
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.buildx.outputs.driver == ''

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-tutorial-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-tutorial-

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Install gtp5g kernel module
        run: |
          if ! lsmod | grep -q gtp5g; then
            echo "Installing gtp5g..."
            chmod +x build/scripts/ci_helper.sh
            ./build/scripts/ci_helper.sh install_gtp5g
          else
            echo "gtp5g already installed."
          fi

      - name: Install Runme CLI
        run: |
          if ! command -v runme &> /dev/null; then
            echo "Installing Runme..."
            RUNME_VERSION="3.16.5"
            wget https://downloads.runme.dev/runme/${RUNME_VERSION}/runme_linux_x86_64.deb
            sudo dpkg -i runme_linux_x86_64.deb
          else
            echo "Runme already installed."
          fi
          runme --version

      - name: Run ${{ matrix.tutorial.name }}
        run: runme run --all --skip-prompts --filename ${{ matrix.tutorial.file }}

      - name: Cleanup ${{ matrix.tutorial.name }}
        if: always()
        run: runme run cleanup --filename ${{ matrix.tutorial.file }}
        continue-on-error: true

      - name: Upload ${{ matrix.tutorial.name }} logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tutorial.artifact-name }}
          path: ${{ matrix.tutorial.log-path }}
          retention-days: 14
