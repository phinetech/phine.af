site_name: phine.af
site_url: https://af.phine.tech/
site_description: Documentation for the phine.af 5G AF project

# Keep docs in the existing /docs folder
docs_dir: docs

theme:
  name: readthedocs

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
    - https://unpkg.com/mermaid@10/dist/mermaid.min.js
    - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Status: status.md
  - Getting Started:
      - Prerequisites: getting-started/01-prerequisites.md
      - Build: getting-started/02-build.md
      - Run: getting-started/03-run.md
      - First Request: getting-started/04-first-request.md
      - Quickstart: getting-started/05-quickstart.md
      - QoS Enforcement Tutorial (HTTP): getting-started/06-qos-http-tutorial.md
      - QoS Enforcement Tutorial (gRPC): getting-started/07-qos-grpc-tutorial.md
      - Demo QoD Adapter Tutorial: getting-started/08-demo-adapter-tutorial.md
  - Architecture:
      - Overview: architecture/overview.md
      - Data Flow: architecture/data-flow.md
      - Components: architecture/components.md
      - Repository Layout: architecture/repository-layout.md
  - APIs:
      - Overview: apis/overview.md
      - CAMARA Compliance: apis/camara-compliance.md
      - Northbound: apis/northbound.md
      - Southbound: apis/southbound.md
  - Development:
      - Add a CAMARA API: development/add-camara-api.md
      - Add a New Adapter: development/add-adapter.md
      - Add a Southbound Handler: development/add-southbound-handler.md
      - Service Handlers: development/service-handlers.md
      - Configuration: development/configuration.md
      - Testing: development/testing.md
      - Runme Guide: development/runme-guide.md
      - Code Style: development/code-style.md
  - Operations:
      - Docker Compose: operations/docker-compose.md
      - Observability: operations/observability.md
      - Security: operations/security.md
  - Troubleshooting:
      - Common Errors: troubleshooting/common-errors.md
      - Debugging: troubleshooting/debugging.md
      - FAQ: troubleshooting/faq.md
  - Reference:
      - Configuration Reference: reference/configuration-reference.md
      - Internal Interfaces: reference/internal-interfaces.md
      - Glossary: reference/glossary.md
  - ADRs: adr/README.md
  - Contributing: contributing.md
