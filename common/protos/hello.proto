/**
 * @file hello.proto
 * @brief Simple hello world protobuf definition for testing and demonstration
 * 
 * This file contains protobuf message and service definitions for a basic
 * hello world example. It serves as a simple test case for the AF's gRPC
 * communication infrastructure and can be used as a reference when creating
 * more complex protobuf definitions.
 * 
 * The file defines:
 * - HelloRequest: A message containing a name to greet
 * - HelloResponse: A message containing the greeting
 * - HelloService: A service with a single SayHello RPC method
 * 
 * This can be used to verify that the gRPC infrastructure is working correctly
 * before implementing more complex services.
 */

syntax = "proto3";

package af.proto;

// Simple hello world message
message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string greeting = 1;
}

// Service definition
service HelloService {
  rpc SayHello(HelloRequest) returns (HelloResponse);
}