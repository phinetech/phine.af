# Unified AF configuration for bundled deployment.
# The bundled `af` process contains AF Core and southbound handlers only.
# Northbound adapters run as standalone applications and connect to AF Core.

# AF Core (Orchestrator)
af_core:
  pcf_base_url: "http://pcf:80/npcf-policyauthorization/v1"
  use_tls: false
  api_version: "v1"

  logging:
    level: "info"
    console_output: true
    file_output: false
    file_path: "/app/logs/af_core.log"

  # AF Core remains externally reachable by standalone northbound apps.
  communication:
    type: "grpc"
    server_address: "0.0.0.0"
    server_port: "50051"

# Southbound PCF Handler
pcf_handler:
  pcf_base_url: "http://pcf:80/npcf-policyauthorization/v1"
  use_tls: false
  api_version: "v1"

  logging:
    level: "info"
    console_output: true
    file_output: false
    file_path: "/app/logs/pcf_handler.log"

  # The bundled southbound handler communicates with AF Core in-process.
  communication:
    type: "direct"

# Global settings
logging:
  level: "info"
  file: "/var/log/oai/af/af.log"
  console: true
  max_size_mb: 10
  max_files: 5

metrics:
  enabled: true
  port: 9090
  path: "/metrics"
