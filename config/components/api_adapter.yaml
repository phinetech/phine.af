# api_adapter.yaml
api_adapter:
  host: "0.0.0.0"
  port: 8080
  threads: 4
  log_level: "info"
  tls_enabled: false
  cert_file: "/etc/oai/af/certs/server.crt"
  key_file: "/etc/oai/af/certs/server.key"

communication:
  type: "grpc"
  af_core_service: "af_core"
  af_core_host: "localhost"
  af_core_port: 50051
  timeout_ms: 5000

logging:
  level: "info"
  file: "/var/log/oai/af/api_adapter.log"
  console: true
  max_size_mb: 10
  max_files: 5

metrics:
  enabled: true
  port: 9090
  path: "/metrics"