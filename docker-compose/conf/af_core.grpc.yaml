# Standalone AF Core configuration for the microservice (afs) deployment.
#
# Mounted into the `af_core` container by docker-compose/compose.yaml so the
# afs config is inspectable and editable without rebuilding the image (the
# image still bakes af_core/config/af_core.yaml as a fallback).
#
# Default transport is gRPC (matches the tutorial's default afs flow on
# :50051). The HTTP variant lives in af_core.http.yaml and is selected by
# docker-compose/compose.http.yaml.

# AF Core (Orchestrator) — northbound gRPC entrypoint
af_core:
  logging:
    level: "info"
    console_output: true
    file_output: false
    file_path: "/app/logs/af_core.log"

  communication:
    kind: "grpc"
    listen:
      host: "0.0.0.0"
      port: 50051
    timeout_ms: 5000

  qod:
    max_session_duration: 86400
    min_session_duration: 60
    session_cleanup_interval: 60
    unavailable_session_ttl: 360
    enable_notifications: true
    api_base_url: "https://api.example.com/quality-on-demand/v1"

# PCF handler link. af_core is the *client*: it dials the handler at `remote`.
# `pcf.base_url` is NOT used by af_core in afs mode — the standalone
# pcf_handler makes the SBI call from its own config — but it is set to the
# real free5GC PCF so the value is correct if af_core ever calls it directly.
pcf_handler:
  enabled: true

  pcf:
    base_url: "http://192.168.70.139:8000/npcf-policyauthorization/v1"
    use_tls: false
    api_version: "v1"

  communication:
    kind: "grpc"
    listen:
      host: "0.0.0.0"
      port: 50055
    remote:
      host: "pcf_handler"
      port: 50055
    client_only: false
    timeout_ms: 5000

nef_handler:
  enabled: false

udr_handler:
  enabled: false
