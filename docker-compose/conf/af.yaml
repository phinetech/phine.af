# Unified AF configuration for bundled Docker deployment
# All three components run in a single container using direct communication.

# Northbound API Component
api_component:
  host: "0.0.0.0"
  port: 8081
  threads: 4
  tls_enabled: false
  cert_file: "/etc/oai/af/certs/server.crt"
  key_file: "/etc/oai/af/certs/server.key"

  logging:
    level: "info"
    console_output: true
    file_output: false
    file_path: "/app/logs/api_component.log"

  communication:
    type: "direct"
    server_address: "0.0.0.0"
    server_port: "50061"
    core_address: "localhost"
    core_port: "50051"

# AF Core (Orchestrator)
af_core:
  pcf_base_url: "http://192.168.70.139:8080/npcf-policyauthorization/v1"
  use_tls: false
  api_version: "v1"

  logging:
    level: "info"
    console_output: true
    file_output: false
    file_path: "/app/logs/af_core.log"

  communication:
    type: "direct"
    server_address: "0.0.0.0"
    server_port: "50051"

# Southbound PCF Handler
pcf_handler:
  pcf_base_url: "http://192.168.70.139:8080/npcf-policyauthorization/v1"
  use_tls: false
  api_version: "v1"

  logging:
    level: "info"
    console_output: true
    file_output: false
    file_path: "/app/logs/pcf_handler.log"

  communication:
    type: "direct"
    server_address: "0.0.0.0"
    server_port: "50055"
    core_address: "localhost"
    core_port: "50051"

# Global settings
logging:
  level: "info"
  file: "/var/log/oai/af/af.log"
  console: true
  max_size_mb: 10
  max_files: 5

metrics:
  enabled: true
  port: 9090
  path: "/metrics"
