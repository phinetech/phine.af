# HTTP-transport variant of the bundled AF configuration.
#
# Same topology as conf/af.yaml, but the northbound entrypoint
# (external client -> af_core) speaks HTTP/2 cleartext (h2c) on port 8080
# instead of gRPC on 50051. The southbound PCF SBI call is HTTP in both modes.
#
# Used by the QoS enforcement tutorial's "HTTP Transport Variant" via
# docker-compose/compose.http.yaml.

# AF Core (Orchestrator) — northbound entrypoint over HTTP/2
af_core:
  logging:
    level: "info"
    console_output: true
    file_output: false
    file_path: "/app/logs/af_core.log"

  communication:
    kind: "http"
    listen:
      host: "0.0.0.0"
      port: 8080
    timeout_ms: 5000

  qod:
    max_session_duration: 86400
    min_session_duration: 60
    session_cleanup_interval: 60
    unavailable_session_ttl: 360
    enable_notifications: true
    api_base_url: "https://api.example.com/quality-on-demand/v1"

# Southbound PCF Handler — in-process (direct) in bundled mode.
# The SBI hop to the free5GC PCF (192.168.70.139) is HTTP via HttpPcfGateway.
pcf_handler:
  enabled: true

  pcf:
    base_url: "http://192.168.70.139:8000/npcf-policyauthorization/v1"
    use_tls: false
    api_version: "v1"

  logging:
    level: "info"
    console_output: true
    file_output: false
    file_path: "/app/logs/pcf_handler.log"

  communication:
    kind: "direct"
    listen:
      host: "0.0.0.0"
      port: 8085
    timeout_ms: 5000

# Future southbound handlers
nef_handler:
  enabled: false

udr_handler:
  enabled: false

# Global settings
logging:
  # NOTE: This legacy `logging:` schema (level/file/console/max_size_mb/max_files)
  # is NOT currently wired to spdlog — file-sink support is tracked in issue
  # #13 ([TECH DEBT] Restore and enhance logging infrastructure). Components
  # log to stdout regardless of these values.
  level: "info"
  file: "/var/log/phine.af/af.log"
  console: true
  max_size_mb: 10
  max_files: 5

metrics:
  enabled: true
  port: 9090
  path: "/metrics"
