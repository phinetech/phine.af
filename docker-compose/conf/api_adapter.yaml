api_adapter:
  host: "0.0.0.0"
  port: 8081
  threads: 4
  tls_enabled: false
  cert_file: "/etc/oai/af/certs/server.crt"
  key_file: "/etc/oai/af/certs/server.key"

  communication:
    type: "grpc"
    core_address: "af"
    core_port: "50051"

logging:
  level: "info"
  file: "/var/log/oai/af/api_adapter.log"
  console: true
  max_size_mb: 10
  max_files: 5

metrics:
  enabled: true
  port: 9090
  path: "/metrics"