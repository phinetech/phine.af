version: "3.8"

services:
  free5gc-upf:
    container_name: upf
    image: free5gc/upf:v4.1.0
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./free5gc/config/upfcfg.yaml:/free5gc/config/upfcfg.yaml
      - ./free5gc/config/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      privnet:
        aliases:
          - upf.free5gc.org

  db:
    container_name: mongodb
    image: mongo:4.4
    command: mongod --port 27017
    expose:
      - "27017"
    volumes:
      # - dbdata:/data/db
      - ./free5gc/dump:/data/dump
      - ./free5gc/mongorestore.sh:/docker-entrypoint-initdb.d/mongorestore.sh
    networks:
      privnet:
        aliases:
          - db

  free5gc-nrf:
    container_name: nrf
    image: free5gc/nrf:v4.1.0
    command: ./nrf -c ./config/nrfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nrf.free5gc.org
    depends_on:
      - db

  free5gc-amf:
    container_name: amf
    image: free5gc/amf:v4.1.0
    command: ./amf -c ./config/amfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        ipv4_address: 192.168.70.16
        aliases:
          - amf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-ausf:
    container_name: ausf
    image: free5gc/ausf:v4.1.0
    command: ./ausf -c ./config/ausfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - ausf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-nssf:
    container_name: nssf
    image: free5gc/nssf:v4.1.0
    command: ./nssf -c ./config/nssfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nssf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-pcf:
    container_name: pcf
    image: free5gc/pcf:v4.1.0
    command: ./pcf -c ./config/pcfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        ipv4_address: 192.168.70.139
        aliases:
          - pcf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-smf:
    container_name: smf
    image: free5gc/smf:v4.1.0
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ./free5gc/config/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - smf.free5gc.org
    depends_on:
      - free5gc-nrf
      - free5gc-upf

  free5gc-udm:
    container_name: udm
    image: free5gc/udm:v4.1.0
    command: ./udm -c ./config/udmcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udm.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-udr:
    container_name: udr
    image: free5gc/udr:v4.1.0
    command: ./udr -c ./config/udrcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udr.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-chf:
    container_name: chf
    image: free5gc/chf:v4.1.0
    command: ./chf -c ./config/chfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/chfcfg.yaml:/free5gc/config/chfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - chf.free5gc.org
    depends_on:
      - db
      - free5gc-nrf
      - free5gc-webui

  free5gc-n3iwf:
    container_name: n3iwf
    image: free5gc/n3iwf:v4.1.0
    command: ./n3iwf -c ./config/n3iwfcfg.yaml
    volumes:
      - ./free5gc/config/n3iwfcfg.yaml:/free5gc/config/n3iwfcfg.yaml
      - ./free5gc/config/n3iwf-ipsec.sh:/free5gc/n3iwf-ipsec.sh
    environment:
      GIN_MODE: release
    cap_add:
      - NET_ADMIN
    networks:
      privnet:
        ipv4_address: 192.168.70.15
        aliases:
          - n3iwf.free5gc.org
    depends_on:
      - free5gc-amf
      - free5gc-smf
      - free5gc-upf

  free5gc-tngf:
    container_name: tngf
    image: free5gc/tngf:v4.1.0
    command: ./tngf -c ./config/tngfcfg.yaml
    volumes:
      - ./free5gc/config/tngfcfg.yaml:/free5gc/config/tngfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    cap_add:
      - NET_ADMIN
    network_mode: host
    depends_on:
      - free5gc-amf
      - free5gc-smf
      - free5gc-upf

  free5gc-nef:
    container_name: nef
    image: free5gc/nef:v4.1.0
    command: ./nef -c ./config/nefcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./free5gc/config/nefcfg.yaml:/free5gc/config/nefcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nef.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-webui:
    container_name: webui
    image: free5gc/webui:v4.1.0
    command: ./webui -c ./config/webuicfg.yaml
    expose:
      - "2121"
    volumes:
      - ./free5gc/config/webuicfg.yaml:/free5gc/config/webuicfg.yaml
    environment:
      - GIN_MODE=release
    networks:
      privnet:
        aliases:
          - webui
    ports:
      - "5000:5000"
      - "2122:2122"
      - "2121:2121"
    depends_on:
      - db
      - free5gc-nrf

  gnb:
    container_name: gnb
    image: tariromukute/ueransim:v3.2.7
    command: ./nr-gnb -c /ueransim/config/gnbcfg.yaml
    volumes:
      - ./ueransim/free5gc-gnb.yaml:/ueransim/config/gnbcfg.yaml
      - ./ueransim/free5gc-ue.yaml:/ueransim/config/uecfg.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun"
    networks:
      privnet:
        aliases:
          - gnb.free5gc.org
    depends_on:
      - free5gc-amf
      - free5gc-upf

  ue:
    container_name: ue
    image: tariromukute/ueransim:v3.2.7
    command:
      - /bin/bash
      - -c
      - |
          sleep 15
          echo "Starting UE..."
          nr-ue -c /ueransim/config/uecfg.yaml
          tail -f /dev/null
    volumes:
      - ./ueransim/free5gc-gnb.yaml:/ueransim/config/gnbcfg.yaml
      - ./ueransim/free5gc-ue.yaml:/ueransim/config/uecfg.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun"
    networks:
      privnet:
        aliases:
          - ue.free5gc.org
    depends_on:
      - free5gc-amf
      - free5gc-upf

  af:
    container_name: "af"
    image: ubuntu:22.04
    expose:
      - 80/tcp
      - 8080/tcp
    environment:
      - TZ=Europe/Paris
    depends_on:
      - free5gc-pcf
    command: 
    - /bin/bash
    - -c
    - |
        apt update -y && apt install curl -y
        tail -f /dev/null
    networks:
      privnet:
        ipv4_address: 192.168.70.143

    # Southbound Handlers
  pcf_handler:
    image: tariromukute/pcf-handler:${TAG:-latest}
    container_name: af-pcf-handler
    depends_on:
      - free5gc-pcf
      - af_core
    build:
      context: ../southbound/
      dockerfile: ./pcf_handler/Dockerfile
    networks:
      privnet:
        ipv4_address: 192.168.70.140

  # AF Core
  af_core:
    image: tariromukute/af-core:${TAG:-latest}
    container_name: af-core
    build:
      context: ../af_core
      dockerfile: Dockerfile
    networks:
      privnet:
        ipv4_address: 192.168.70.141

  # Northbound Components
  api_component:
    image: tariromukute/af-api:${TAG:-latest}
    container_name: af-north-api
    depends_on:
      - af_core
    build:
      context: ../northbound/api_component
      dockerfile: Dockerfile
    networks:
      privnet:
        ipv4_address: 192.168.70.142


networks:
  privnet:
    ipam:
      driver: default
      config:
        - subnet: 192.168.70.0/24
    driver_opts:
      com.docker.network.bridge.name: br-free5gc

